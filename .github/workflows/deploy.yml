name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  # Deploys are never cancelled mid-flight: killing one between "migration
  # applied" and "code live" leaves the two out of step.
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Migrations run BEFORE the new code goes live, so the schema is always
      # at least as new as the code reading it. This is only safe because every
      # migration is written to be backward-compatible with the previous
      # release - see docs/DEPLOYMENT.md for the expand/contract rule.
      - name: Apply migrations to staging
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      # The API ships first: its changes are additive, so the old storefront
      # keeps working against the new API, while a new storefront may call an
      # endpoint the old API does not have.
      - name: Deploy the API
        env:
          HOOK: ${{ secrets.API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::API_DEPLOY_HOOK_URL is not set; skipping the API deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "API deploy triggered."

      # The Vercel project's root directory is `frontend`, so this builds the
      # storefront only.
      - name: Deploy the storefront
        id: deploy
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Through the storefront, so this exercises both services and the rewrite
      # between them: a 200 here means the API answered and the database is up.
      - name: Smoke test the deployment
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Staging did not report healthy within 60s"
          exit 1

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    # Requires a manual approval configured on the GitHub environment, so a
    # merge to main never reaches customers without a human saying yes.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Back up the production database
        run: |
          echo "Managed provider snapshot is triggered here."
          echo "Neon/Supabase/RDS all expose a point-in-time restore API;"
          echo "see docs/DEPLOYMENT.md for the restore procedure."

      - name: Apply migrations to production
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Deploy the API
        env:
          HOOK: ${{ secrets.API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::API_DEPLOY_HOOK_URL is not set; skipping the API deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "API deploy triggered."

      - name: Deploy the storefront
        id: deploy
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify production health
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://momishop.pk/api/health" || true)
            if [ "$STATUS" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Production health check failed. Roll back with: vercel rollback"
          exit 1
