version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    # Grouped so a routine week is one reviewable PR rather than fifteen.
    groups:
      production-patches:
        dependency-type: production
        update-types: [patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major framework upgrades are deliberate, scheduled work with their own
      # migration guides, not something to merge from a bot PR on a Monday.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
