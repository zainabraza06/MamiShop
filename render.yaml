# Render blueprint: the MomiShop API and its database.
#
# In Render: New → Blueprint, point it at this repository. It creates the
# Postgres instance and the API service, and wires the connection string
# between them. Everything marked `sync: false` has to be filled in once, in
# the dashboard — those are secrets, and secrets do not belong in git.
#
# The storefront is not here: it deploys to Vercel from frontend/.
# See docs/DEPLOYMENT.md for the whole runbook.

databases:
  - name: momishop-db
    databaseName: momishop
    user: momishop
    # Singapore is Render's closest region to Pakistan. Keep the API and the
    # storefront in the same one — the storefront calls the API on every render.
    region: singapore
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: momishop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The build context is the repository root: the API bundle compiles
    # @momishop/shared from source, and the lockfile lives there.
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    # Deploys are triggered by .github/workflows/deploy.yml, which applies
    # migrations first — so the schema is never older than the code reading it.
    # Set API_DEPLOY_HOOK_URL in GitHub to this service's deploy hook.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Render terminates TLS one hop in front of the container, so exactly one
      # forwarded address is trustworthy. Without this, every visitor shares a
      # single rate-limit bucket.
      - key: TRUST_PROXY
        value: '1'

      - key: DATABASE_URL
        fromDatabase:
          name: momishop-db
          property: connectionString
      # Render's Postgres has no transaction pooler in front of it, so
      # migrations use the same connection string.
      - key: DIRECT_URL
        fromDatabase:
          name: momishop-db
          property: connectionString

      # Must be the SAME value as the storefront's AUTH_SECRET: the API signs
      # session tokens with it and the storefront's proxy verifies them.
      - key: AUTH_SECRET
        sync: false
      # The storefront's public URL — email links and sign-in redirects, and
      # the origin allowed to make state-changing calls.
      - key: APP_URL
        sync: false
      # This service's own public URL, used to build the Google OAuth callback.
      - key: API_PUBLIC_URL
        sync: false
      - key: CRON_SECRET
        sync: false

      # Optional integrations. Each degrades gracefully when unset: email and
      # SMS log instead of sending, and without Redis the API falls back to
      # per-process rate limiting (fine on one instance, not on several).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
